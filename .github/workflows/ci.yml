name: Toolkit CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toolkit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-validation:
    name: Deterministic repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: false

      - name: Compile Python sources
        run: python -m compileall -q tools tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate toolkit structure and contracts
        run: python tools/validate_toolkit.py

      - name: Validate project-memory templates
        run: python tools/validate_project_memory.py

      - name: Validate evaluation case and rubric definitions
        run: python tools/evaluate_toolkit.py --validate
